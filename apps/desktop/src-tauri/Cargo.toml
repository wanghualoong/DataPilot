[package]
name = "datapilot-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DataPilot desktop shell (Tauri 2): runs datapilot-core and relays JSON-RPC to the React UI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
