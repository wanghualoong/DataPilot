[package]
name = "datapilot-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DataPilot agent core (M1 of ADR-0012): agent loop, tools, permissions, kernel, sessions, compaction; stdio JSON-RPC app-server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "datapilot-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
regex = "1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rquickjs = { version = "0.8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Time", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Networking_WinHttp", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = 3
strip = true
